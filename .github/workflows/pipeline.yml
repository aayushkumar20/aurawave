name: Aura Music CI/CD Pipeline & Auto-Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ci-cd-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Android APK
  # -------------------------------------------------------------
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant Execute Permissions for gradlew
        run: chmod +x android/gradlew

      - name: 🔨 Compile & Assemble Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 📦 Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./AuraMusic-Android.apk
          echo "apk_path=./AuraMusic-Android.apk" >> $GITHUB_OUTPUT

      - name: 🚀 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Android-APK
          path: ./AuraMusic-Android.apk
          retention-days: 30

  # -------------------------------------------------------------
  # Job 2: Build Native iOS App
  # -------------------------------------------------------------
  build-ios:
    name: 🍎 Build Native iOS App
    runs-on: macos-14
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Swift & Xcode
        run: |
          swift --version
          xcodebuild -version

      - name: 🔨 Build Swift Package
        run: |
          cd ios
          swift build -c release

      - name: 🚀 Upload iOS Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-iOS-Binary
          path: ios/.build/release/AuraMusic
          if-no-files-found: ignore
          retention-days: 30

  # -------------------------------------------------------------
  # Job 3: Publish Web Player to GitHub Pages
  # -------------------------------------------------------------
  publish-web-pages:
    name: 🌐 Publish Web Player (GitHub Pages)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 📦 Upload Web Player Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'firebase/public'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

  # -------------------------------------------------------------
  # Job 4: Publish GitHub Release with APK & Changelog
  # -------------------------------------------------------------
  publish-release:
    name: 📢 Publish GitHub Release (APK Asset)
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Built Android APK
        uses: actions/download-artifact@v4
        with:
          name: AuraMusic-Android-APK
          path: ./release-artifacts

      - name: 🏷️ Determine Release Tag & Version
        id: tag_version
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          TAG="v1.0-${TIMESTAMP}"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.release_tag }}
          name: "Aura Music Release ${{ steps.tag_version.outputs.release_tag }}"
          body: |
            ## 🎵 Aura Music - Native & Web Release

            ### ✨ What's Included
            - **100% Real-Time Live YouTube Streaming**: Live search suggestions and trending charts dynamically queried from YouTube.
            - **100% Complete Songs**: Full 3 to 5+ minute tracks with zero 30s cutoffs.
            - **100% Ad-Free**: Background playback with zero audio/video ads.
            - **Multi-Device Playback Sync**: Real-time room seeking & play/pause synchronization across devices.
            - **Frictionless Room Chat**: Chat, emoji reactions, and instant track sharing.

            ### 📱 Download & Install
            - **Android**: Download `AuraMusic-Android.apk` below and install directly onto your device.
            - **iOS**: Available in `ios/` directory (open `ios/Package.swift` in Xcode or install via Sideloadly/AltStore).
            - **Web Player**: Open `firebase/public/index.html` or visit the published live web player.
          files: |
            ./release-artifacts/AuraMusic-Android.apk
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
